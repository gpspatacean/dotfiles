# Bindings
## Change prefix from Ctrl+b to Ctrl+space
unbind C-b
set -g prefix C-Space

## Bind config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded config file from ~/.config/tmux/tmux.conf"

## More clear keys for splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

## vim-like pane switching
unbind Left
unbind Down
unbind Up
unbind Right
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

## vim-like pane resizing
unbind C-Left
unbind C-Down
unbind C-Up
unbind C-Right
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Generic settings
## Change windows` index to start from 1 i/o 0
set -g base-index 1
setw -g pane-base-index 1

## Renumber windows on close
set -g renumber-windows on

set -g default-terminal "tmux-256color"
# Plugins
## Install plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'

## Catppuccin customization
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_window_left_separator "#[fg=#{@thm_blue},bg=#{@thm_mantle}]\ue0d7"
set -g @catppuccin_window_number "#[fg=#{@thm_crust},bg=#{@thm_blue}] \uf2d0  #I "
set -g @catppuccin_window_middle_separator "#[bg=#{@thm_blue},fg=#{@thm_surface_0}]\ue0b1"
set -g @catppuccin_window_text "#[fg=#{@thm_crust},bg=#{@thm_blue}] #W "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_blue},bg=#{@thm_mantle}]\ue0b0"

set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_peach},bg=#{@thm_mantle}]\ue0d7"
set -g @catppuccin_window_current_number "#[fg=#{@thm_crust},bg=#{@thm_peach}] \uf2d0  #I "
set -g @catppuccin_window_current_middle_separator "#[bg=#{@thm_peach},fg=#{@thm_surface_0}]\ue0b1 "
set -g @catppuccin_window_current_text "#[fg=#{@thm_crust},bg=#{@thm_peach}] #W "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_peach},bg=#{@thm_mantle}]\ue0b0"

# Example for module customization
#set -g @catppuccin_session_icon "#[fg=#{@thm_green},bg=#{@thm_mantle}]#[fg=#{@thm_crust},bg=#{@thm_green}] "
#set -g @catppuccin_session_text "#[fg=#{@thm_green},bg=#{@thm_surface_0}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S #[fg=#{@thm_surface_0},bg=#{@thm_mantle}]"

# We want different separators for each module, so disable the default ones
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
# user
set -g @catppuccin_user_icon "#[fg=#{@thm_sky},bg=#{@thm_mantle}]\ue0b2#[fg=#{@thm_crust},bg=#{@thm_sky}] "
set -g @catppuccin_user_text "#[bg=#{@thm_sky},fg=#{@thm_crust}]\ue0b3 #(whoami) #[fg=#{@thm_mantle},bg=#{@thm_sky}]\ue0b2"

# host
set -g @catppuccin_host_icon "#[fg=#{@thm_mauve},bg=#{@thm_mantle}]\ue0b2#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰒋 "
set -g @catppuccin_host_text "#[bg=#{@thm_mauve},fg=#{@thm_crust}]\ue0b3 #H #[fg=#{@thm_mauve},bg=#{@thm_mantle}]"

# session
set -g @session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_session_icon "#[fg=#{E:@session_color},bg=#{@thm_mantle}]#[fg=#{@thm_crust},bg=#{E:@session_color}] "
set -g @catppuccin_session_text "#[bg=#{E:@session_color},fg=#{@thm_crust}]\ue0b1 #S #[fg=#{E:@session_color},bg=#{@thm_mantle}]\ue0b0"

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}"
set -g window-status-separator ""
## End of Catppuccin customization

## Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
